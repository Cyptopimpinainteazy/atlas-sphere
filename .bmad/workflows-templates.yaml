# Workflow Consolidation Configuration
# Purpose: Define 24 GitHub workflow files for consolidation via template generation
# Generated: Consolidated workflow templates (Phase 2b)
#
# Usage: 
#   1. Modify workflow definitions below
#   2. Run: python3 scripts/process_templates.py --template-type workflow
#   3. Verify: make bmad-validate-workflows
#   4. Deploy: Generated files in .github/workflows/ (auto-generated)

workflows:
  # CI Workflows
  - id: ci
    name: CI
    description: Core CI pipeline (push, PR, Rust linting and testing)
    filename: ci.yml
    triggers:
      - type: push
        branches: [main, "feature/**", "copilot/**"]
      - type: pull_request
        branches: [main]
    env:
      CARGO_TERM_COLOR: always
    jobs:
      - name: prod-gate
        template: rust-cargo-ci
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo fmt --all -- --check
          - run: cargo clippy --all-targets -- -D warnings
          - run: cargo test --workspace --release
          - run: chmod +x ./RUN_ALL_TESTS.sh && ./RUN_ALL_TESTS.sh
          - run: cargo bfrontend/uild -p atlas-sphere-runtime --release --target wasm32-unknown-unknown --no-default-features
      - name: feature-coverage
        template: rust-cargo-ci
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo clippy --all-targets --all-features -- -D warnings
          - run: cargo test --workspace --release --all-features

  - id: ci-swarm
    name: Swarm Dashboard CI
    description: Swarm apps/apps/dash-legacy-2-legacy-2board CI workflow (Node.js tests)
    filename: ci-swarm.yml
    triggers:
      - type: push
        branches: [main, "feat/**"]
      - type: pull_request
        branches: [main]
        paths:
          - "apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2/**"
          - "tools/**"
          - "alembic/**"
          - ".github/workflows/ci-swarm.yml"
    env:
      CARGO_TERM_COLOR: always
    jobs:
      - name: test
        template: node-ci
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: npm install
          - run: npm run lint
          - run: npm run test

  - id: bmad
    name: BMAD Integration
    description: BMAD method installation and verification
    filename: bmad.yml
    triggers:
      - type: pull_request
        branches: [main, "feature/**"]
      - type: push
        branches: [main]
    jobs:
      - name: bmad-install
        template: node-ci
        steps:
          - checkout
          - node-setup-v20
          - run: cd crates/vibe-bmad && npm run install-bmad
          - run: npx bmad-method --version || npx bmad-method@alpha --version
          - run: cd crates/vibe-bmad && npm run ci-init

  # E2E / Integration Workflows
  - id: e2e-integration-tests
    name: E2E Integration Tests
    description: End-to-end integration testing
    filename: e2e-integration-tests.yml
    triggers:
      - type: push
        branches: [main]
      - type: pull_request
        branches: [main]
    jobs:
      - name: e2e-integration-tests
        template: cargo-e2e
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --all --test '*' -- --test-threads 1

  - id: e2e-kms-regtest
    name: E2E KMS Regtest
    description: KMS regression testing
    filename: e2e-kms-regtest.yml
    triggers:
      - type: push
        branches: [main]
      - type: pull_request
        branches: [main]
    jobs:
      - name: e2e-kms-regtest
        template: cargo-e2e
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --package kms-regtest -- --test-threads 1

  - id: startup-smoke
    name: Startup Smoke Test
    description: Startup smoke test verification
    filename: startup_smoke.yml
    triggers:
      - type: push
        branches: [main]
      - type: pull_request
        branches: [main]
    jobs:
      - name: smoke
        template: cargo-test
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --package startup-test -- --test-threads 1

  - id: production-deploy
    name: Production Deploy
    description: Production deployment pipeline
    filename: production-deploy.yml
    triggers:
      - type: workflow_dispatch
      - type: push
        branches: [main]
    env:
      DEPLOYMENT_ENV: production
    jobs:
      - name: prod-gate
        template: production-gate
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo bfrontend/uild --release --all-targets
      - name: prod-deploy
        needs: [prod-gate]
        template: production-deploy
        steps:
          - checkout
          - run: |
              echo "Deploying to production..."
              ./scripts/deploy.sh production

  # Ollama Workflows
  - id: ollama-integration
    name: Ollama Integration
    description: Ollama LLM integration testing
    filename: ollama-integration.yml
    triggers:
      - type: pull_request
        branches: [main]
    jobs:
      - name: test
        template: node-ci
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: npm install
          - run: npm test

  - id: ollama-integration-scheduled
    name: Ollama Integration (Scheduled)
    description: Scheduled ollama integration tests
    filename: ollama-integration-scheduled.yml
    triggers:
      - type: schedule
        cron: "0 3 * * *"
    jobs:
      - name: scheduled-ollama
        template: node-ci
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: npm install
          - run: npm test
          - name: Upload results
            uses: actions/upload-artifact@v4
            with:
              name: ollama-test-results
              path: test-results/

  - id: ollama-bfrontend/uild-image
    name: Ollama Bfrontend/uild Image
    description: Bfrontend/uild and push ollama container image
    filename: ollama-bfrontend/uild-image.yml
    triggers:
      - type: push
        branches: [main]
        paths:
          - "docker/ollama/**"
          - ".github/workflows/ollama-bfrontend/uild-image.yml"
    jobs:
      - name: bfrontend/uild-and-push
        template: docker-bfrontend/uild
        steps:
          - checkout
          - docker-setup
          - run: docker bfrontend/uild -t ollama:latest -f docker/ollama/Dockerfile .
          - run: docker push ollama:latest

  - id: ollama-triage-test
    name: Ollama Triage Test
    description: Ollama triage test workflow
    filename: ollama-triage-test.yml
    triggers:
      - type: pull_request
        branches: [main]
        paths:
          - "crates/ollama/**"
          - ".github/workflows/ollama-triage-test.yml"
    jobs:
      - name: test
        template: cargo-test
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --package ollama --all-features

  - id: ollama-triage-scheduled
    name: Ollama Triage (Scheduled)
    description: Scheduled ollama triage tests
    filename: ollama-triage-scheduled.yml
    triggers:
      - type: schedule
        cron: "0 2 * * *"
    jobs:
      - name: test
        template: cargo-test
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --package ollama-triage -- --test-threads 1

  # Dashboard Workflows
  - id: apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2-e2e
    name: Swarm Dashboard E2E
    description: Swarm apps/apps/dash-legacy-2-legacy-2board E2E testing
    filename: apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2-e2e.yml
    triggers:
      - type: pull_request
        branches: [main]
        paths:
          - "apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2/**"
          - ".github/workflows/apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2-e2e.yml"
    jobs:
      - name: e2e
        template: node-e2e
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: cd apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2 && npm install && npm run e2e

  - id: apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2-axe-triage
    name: Swarm Dashboard Axe Triage
    description: Accessibility testing for swarm apps/apps/dash-legacy-2-legacy-2board
    filename: apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2-axe-triage.yml
    triggers:
      - type: pull_request
        branches: [main]
        paths:
          - "apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2/**"
    jobs:
      - name: axe-triage
        template: node-ci
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: cd apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2 && npm install && npx axe-core scan . --exit

  - id: apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2-pipeline-smoke
    name: Swarm Dashboard Pipeline Smoke
    description: Swarm apps/apps/dash-legacy-2-legacy-2board pipeline smoke test
    filename: apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2-pipeline-smoke.yml
    triggers:
      - type: pull_request
        branches: [main]
        paths:
          - "apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2/**"
    jobs:
      - name: smoke
        template: node-ci
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: cd apps/apps/swarm-apps/apps/dash-legacy-2-legacy-2board-legacy-2-legacy-2 && npm install && npm run test

  - id: swarm-media-integration
    name: Swarm Media Integration
    description: Swarm media processing integration
    filename: swarm-media-integration.yml
    triggers:
      - type: pull_request
        branches: [main]
        paths:
          - "swarm-media/**"
          - ".github/workflows/swarm-media-integration.yml"
      - type: push
        branches: [main]
    jobs:
      - name: test
        template: node-ci
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: cd swarm-media && npm install && npm test
          - name: Upload coverage
            uses: codecov/codecov-action@v3
            with:
              files: ./swarm-media/coverage/lcov.info

  # Testing Workflows
  - id: alembic-roundtrip
    name: Alembic Roundtrip
    description: Database migration roundtrip testing
    filename: alembic-roundtrip.yml
    triggers:
      - type: pull_request
        branches: [main]
        paths:
          - "alembic/**"
          - ".github/workflows/alembic-roundtrip.yml"
    jobs:
      - name: roundtrip
        template: python-ci
        steps:
          - checkout
          - python-setup
          - run: cd alembic && pip install -r reqfrontend/uirements.txt
          - run: cd alembic && python -m pytest tests/

  - id: docker-publish
    name: Docker Publish
    description: Publish Docker images
    filename: docker-publish.yml
    triggers:
      - type: push
        branches: [main]
        paths:
          - "docker/**"
          - ".github/workflows/docker-publish.yml"
    jobs:
      - name: publish
        template: docker-bfrontend/uild
        steps:
          - checkout
          - docker-setup
          - run: docker bfrontend/uild -t atlas-sphere:latest .
          - run: docker push atlas-sphere:latest

  - id: playwright-e2e
    name: Playwright E2E
    description: Playwright browser automation tests
    filename: playwright-e2e.yml
    triggers:
      - type: pull_request
        branches: [main]
      - type: push
        branches: [main]
    jobs:
      - name: e2e
        template: node-e2e
        steps:
          - checkout
          - node-setup
          - node-cache
          - run: npm install
          - run: npx playwright install
          - run: npm run e2e

  - id: real-vm-integration
    name: Real VM Integration
    description: Real VM environment integration testing
    filename: real-vm-integration.yml
    triggers:
      - type: schedule
        cron: "0 4 * * *"
      - type: workflow_dispatch
    jobs:
      - name: test
        template: cargo-e2e
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --all --test 'vm_*' -- --test-threads 1 --nocapture

  - id: run-aggregate-telemetry
    name: Run Aggregate Telemetry
    description: Aggregate and report telemetry data
    filename: run-aggregate-telemetry.yml
    triggers:
      - type: schedule
        cron: "0 0 * * 0"
      - type: workflow_dispatch
    jobs:
      - name: aggregate
        template: python-ci
        steps:
          - checkout
          - python-setup
          - run: python scripts/telemetry/aggregate.py
          - name: Upload report
            uses: actions/upload-artifact@v4
            with:
              name: telemetry-report
              path: reports/

  - id: sigill-fallback-aggregator
    name: SIGILL Fallback Aggregator
    description: SIGILL signal fallback aggregation
    filename: sigill-fallback-aggregator.yml
    triggers:
      - type: schedule
        cron: "*/5 * * * *"
    jobs:
      - name: aggregate
        template: python-ci
        steps:
          - checkout
          - python-setup
          - run: python scripts/sigill/aggregate.py

  - id: sigill-triage-integration
    name: SIGILL Triage Integration
    description: SIGILL signal triage and integration
    filename: sigill-triage-integration.yml
    triggers:
      - type: push
        branches: [main]
        paths:
          - "crates/sigill/**"
          - ".github/workflows/sigill-triage-integration.yml"
      - type: pull_request
        branches: [main]
        paths:
          - "crates/sigill/**"
    jobs:
      - name: test
        template: cargo-test
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --package sigill-triage -- --test-threads 1
      - name: integration
        needs: [test]
        template: cargo-test
        steps:
          - checkout
          - rust-toolchain
          - cargo-cache
          - run: cargo test --package sigill-integration -- --test-threads 1

  - id: summary
    name: Summary
    description: Workflow summary and status reporting
    filename: summary.yml
    triggers:
      - type: workflow_run
        workflows: [CI, "E2E Integration Tests", "Production Deploy"]
        types: [completed]
    jobs:
      - name: summary
        template: python-ci
        steps:
          - checkout
          - python-setup
          - run: python scripts/summary.py

# Templates for common job patterns (referenced in workflows above)
templates:
  rust-cargo-ci:
    description: Standard Rust CI job (checkout, toolchain, cache, clippy, test)
    
  node-ci:
    description: Standard Node.js CI job (checkout, node setup, cache, npm test)
    
  cargo-e2e:
    description: Cargo-based E2E testing job
    
  cargo-test:
    description: Basic Cargo test job (checkout, toolchain, cache, cargo test)
    
  production-gate:
    description: Production deployment gate (bfrontend/uild checks)
    
  production-deploy:
    description: Production deployment job (reqfrontend/uires approval)
    
  docker-bfrontend/uild:
    description: Docker bfrontend/uild and push job
    
  node-e2e:
    description: Node.js E2E testing job (playwright, etc)
    
  python-ci:
    description: Python CI job (checkout, python setup, run tests)

# Common step definitions (referenced above)
step-templates:
  checkout: "uses: actions/checkout@v4"
  rust-toolchain: "uses: dtolnay/rust-toolchain@stable\n        with:\n          components: clippy,rustfmt\n          targets: wasm32-unknown-unknown"
  cargo-cache: "uses: actions/cache@v4\n        with:\n          path: |\n            ~/.cargo/registry\n            ~/.cargo/git\n            target\n          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}\n          restore-keys: |\n            ${{ runner.os }}-cargo-"
  node-setup: "uses: actions/setup-node@v4\n        with:\n          node-version: 18"
  node-setup-v20: "uses: actions/setup-node@v4\n        with:\n          node-version: 20"
  node-cache: "uses: actions/cache@v4\n        with:\n          path: node_modules\n          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}\n          restore-keys: |\n            ${{ runner.os }}-npm-"
  python-setup: "uses: actions/setup-python@v4\n        with:\n          python-version: '3.11'"
  docker-setup: "uses: docker/setup-bfrontend/uildx-action@v2"
