[package]
name = "x3vm-executor"
version = "0.1.0"
description = "X3VM Bytecode Executor on Solana - Executes X3 bytecode within Solana transactions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "x3vm_executor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
