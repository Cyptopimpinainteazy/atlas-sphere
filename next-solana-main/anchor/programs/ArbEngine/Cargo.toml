[package]
name = "arb_engine"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arb_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.22"

# DEX integrations
# For Serum
serum_dex = { version = "0.5.6", features = ["no-entrypoint", "futures"] }
# For Raydium
raydium-amm = "0.1" # Placeholder, actual version needed
# For Orca
orca-sdk = "0.1" # Placeholder
# For Jupiter
jupiter-sdk = "0.1" # Placeholder, Jupiter is off-chain mostly, but for on-chain swaps use their program

spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "0.9.0", features = ["no-entrypoint"] }

# Price feeds
switchboard-v2 = "0.2" # For price oracles
pyth-sdk-solana = "0.8.0"

solana-sdk = "1.18.22"
