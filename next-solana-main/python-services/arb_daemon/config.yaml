# Production Configuration for Solana Flashloan Arbitrage Daemon
# This file contains all production settings for the arbitrage bot

# Network Configuration
network:
  mainnet_beta:
    rpc_url: "https://api.mainnet-beta.solana.com"
    fallback_rpcs:
      - "https://solana-api.projectserum.com"
      - "https://rpc.ankr.com/solana"
      - "https://ssc-dao.genesysgo.net"
      - "https://solana-mainnet.rpc.extrnode.com"
    commitment: "confirmed"
    preflight_commitment: "confirmed"

# Trading Parameters
trading:
  min_profit_usd: 10.0
  slippage_bps: 50  # 0.5%
  max_hops: 4
  circuit_breaker_threshold: 3
  emergency_unwind_threshold: -100.0  # USD loss
  priority_fee_lamports: 10000
  max_retries: 5
  confirmation_timeout: 60  # seconds
  bundle_size_limit: 5  # transactions per bundle

# DEX Program IDs
programs:
  raydium: "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
  orca: "9W959DqEETiGZocYWCQPaJ6sBmUzgfxXfqGeTEdp3aQP"
  serum: "9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin"
  jupiter: "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"
  flashloan_receiver: "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"
  arb_engine: "Arb1EngineProgramIdPlaceholder1234567890"

# Token Pairs to Monitor
token_pairs:
  - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v_So11111111111111111111111111111111111111112"  # USDC/SOL
  - "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v_EzfgjvkSwB6Pj8heBvM7wi2GSJweJ7xX5J2jS4K7w"  # USDC/USDT
  # Add more pairs as needed

# MEV Protection Settings
mev_protection:
  enable_sandwich_detection: true
  enable_timing_randomization: true
  enable_transaction_bundling: true
  sandwich_detection_threshold: 0.001  # 0.1% price impact threshold
  timing_randomization_range: [0.1, 1.0]  # seconds

# Risk Management
risk_management:
  max_concurrent_trades: 3
  max_trades_per_hour: 100
  max_daily_loss: -500.0  # USD
  position_size_limits:
    min: 1000000      # 0.01 SOL minimum
    max: 1000000000   # 1 SOL maximum
  exposure_limits:
    per_token: 0.1    # Max 10% exposure per token
    total: 0.5        # Max 50% total exposure

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
  files:
    main: "arb_daemon.log"
    errors: "arb_daemon_error.log"
    trades: "trade_history.log"
  max_file_size: "10 MB"
  backup_count: 5

# Database Configuration
database:
  type: "sqlite3"
  path: "arb_history.db"
  backup_interval: 3600  # 1 hour in seconds
  retention_days: 30

# API Configuration
api:
  jupiter_base_url: "https://quote-api.jup.ag/v6"
  timeout: 10  # seconds
  retry_attempts: 3
  retry_delay: 1  # seconds

# Health Monitoring
health:
  enable_monitoring: true
  metrics_interval: 60  # seconds
  alerts:
    enabled: true
    telegram_bot_token: ""  # Set in environment
    telegram_chat_id: ""    # Set in environment
    email_smtp: ""          # Set in environment
    email_recipients: []    # Set in environment

# Performance Tuning
performance:
  monitor_frequency: 1.0  # Hz (1 second)
  batch_size: 10  # Token pairs per batch
  cache_ttl: 30  # Price cache TTL in seconds
  connection_pool_size: 10
  max_workers: 4  # Concurrent workers

# Emergency Controls
emergency:
  enable_emergency_stop: true
  stop_loss_threshold: -100.0  # USD
  circuit_breaker_reset_time: 3600  # 1 hour in seconds
  admin_contacts:
    - ""  # Add phone/email for alerts

# Testing Configuration (only used in test mode)
testing:
  enabled: false
  mock_prices: false
  simulate_trades: false
  dry_run: true