[package]
name = "atlas-sphere-runtime"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["Traycer.AI <dev@atlas-sphere.io>"]
description = "Atlas Sphere L1 Substrate runtime with dual-VM scaffolding."
license = "Apache-2.0"
# Ensures Atlas Sphere runtime Cargo manifest aligns with required Substrate runtime dependencies and feature flags.
# Maintains std/runtime-benchmarks enablement and WASM build configuration for dual-VM execution tooling.
build = "build.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "atlas_sphere_runtime"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }

frame-support = { workspace = true, default-features = false }
frame-system = { workspace = true, default-features = false }
frame-executive = { workspace = true, default-features = false }
frame-benchmarking = { workspace = true, default-features = false, optional = true }

pallet-aura = { workspace = true, default-features = false }
pallet-grandpa = { workspace = true, default-features = false }
pallet-timestamp = { workspace = true, default-features = false }
pallet-balances = { workspace = true, default-features = false }
pallet-transaction-payment = { workspace = true, default-features = false }
pallet-sudo = { workspace = true, default-features = false, optional = true }
pallet-collective = { workspace = true, default-features = false }
pallet-evm = { workspace = true, default-features = false }
pallet-evm-precompile-simple = { workspace = true, default-features = false }
pallet-evm-precompile-modexp = { workspace = true, default-features = false }
pallet-evm-precompile-sha3fips = { workspace = true, default-features = false }

pallet-atlas-kernel = { path = "../pallets/atlas-kernel", default-features = false }
pallet-atomic-trade-engine = { path = "../pallets/atomic-trade-engine", default-features = false }
atlas-evm-integration = { path = "../crates/evm-integration", default-features = false }
atlas-svm-integration = { path = "../crates/svm-integration", default-features = false }

sp-api = { workspace = true, default-features = false }
sp-block-builder = { workspace = true, default-features = false }
sp-consensus-aura = { workspace = true, default-features = false }
sp-consensus-grandpa = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
sp-inherents = { workspace = true, default-features = false }
sp-offchain = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sp-session = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-transaction-pool = { workspace = true, default-features = false }
sp-version = { workspace = true, default-features = false }
sp-weights = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }

frame-system-rpc-runtime-api = { workspace = true, default-features = false }

log = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive"], optional = true }
getrandom = { version = "0.2", default-features = false, features = ["js"] }
# Local Atlas Sphere EVM integration utilities (Frontier temporarily removed)
# atlas-evm-integration = { path = "../crates/evm-integration", default-features = false }

[build-dependencies]
substrate-wasm-builder = { workspace = true }

[features]
default = ["std"]
dev = ["pallet-sudo"]
skip-wasm-build = []
std = [
	"codec/std",
	"scale-info/std",
	"frame-support/std",
	"frame-system/std",
	"frame-executive/std",
	"frame-benchmarking?/std",
	"frame-system-rpc-runtime-api/std",
	"pallet-aura/std",
	"pallet-grandpa/std",
	"pallet-timestamp/std",
	"pallet-balances/std",
	"pallet-transaction-payment/std",
	"pallet-sudo?/std",
	"pallet-collective/std",
	"pallet-evm/std",
	"pallet-evm-precompile-simple/std",
	"pallet-evm-precompile-modexp/std",
	"pallet-evm-precompile-sha3fips/std",
	"pallet-atlas-kernel/std",
	"pallet-atomic-trade-engine/std",
	"atlas-evm-integration/std",
	"atlas-svm-integration/std",
	"sp-api/std",
	"sp-block-builder/std",
	"sp-consensus-aura/std",
	"sp-consensus-grandpa/std",
	"sp-core/std",
	"sp-inherents/std",
	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-std/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"sp-weights/std",
	"sp-io/std",
	"log/std",
	"serde/std",
	# "atlas-evm-integration/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-atlas-kernel/runtime-benchmarks",
	"pallet-atomic-trade-engine/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]

native = []

disable-runtime-api = []

try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
]
