[package]
name = "pallet-atomic-trade-engine"
version = "0.1.0"
description = "Cross-VM Atomic Trading Engine for Atlas Sphere - enables atomic arbitrage and multi-hop trades across EVM and SVM"
authors = ["Atlas Sphere Team"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/atlas-sphere/atlas-sphere"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# SCALE codec
codec = { package = "parity-scale-codec", version = "3.6.1", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }

# Substrate primitives
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false }

# FRAME dependencies
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false, optional = true }

# Timestamp for oracle functionality
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0", default-features = false }

# Local dependencies
pallet-atlas-kernel = { path = "../atlas-kernel", default-features = false }

# Optional: VM integration crates (std-only for now)
atlas-evm-integration = { path = "../../crates/evm-integration", default-features = false, optional = true }
atlas-svm-integration = { path = "../../crates/svm-integration", default-features = false, optional = true }

[dev-dependencies]
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0" }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "release-crates-io-v1.3.0" }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-std/std",
    "frame-support/std",
    "frame-system/std",
    "frame-benchmarking?/std",
    "pallet-timestamp/std",
    "pallet-atlas-kernel/std",
    "atlas-evm-integration?/std",
    "atlas-svm-integration?/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-atlas-kernel/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-atlas-kernel/try-runtime",
]
