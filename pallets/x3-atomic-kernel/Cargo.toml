[package]
name = "pallet-x3-atomic-kernel"
version = "0.1.0"
edition = "2021"
description = "X3 Atomic Kernel pallet — bundle orchestration, lifecycle management, and PoAE proof anchoring to finality certificates"
license = "Apache-2.0"
authors = ["X3 Labs"]

[dependencies]
frame-support     = { workspace = true }
frame-system      = { workspace = true }
sp-core           = { workspace = true }
sp-runtime        = { workspace = true }
sp-std            = { workspace = true }
sp-io             = { workspace = true }
parity-scale-codec = { workspace = true }
scale-info        = { workspace = true }
log               = { workspace = true }

[dev-dependencies]
sp-io   = { workspace = true }
sp-core = { workspace = true }

[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-io/std",
    "log/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
