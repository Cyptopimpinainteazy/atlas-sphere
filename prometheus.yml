global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'llm-router-monitor'

scrape_configs:
  - job_name: 'llm-router'
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'ollama'
    static_configs:
      - targets: ['127.0.0.1:11434']
    metrics_path: '/api/ps'
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
