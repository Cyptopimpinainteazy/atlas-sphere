[package]
name = "gpu-swarm"
version = "0.1.0"
edition = "2021"
description = "Distributed GPU compute swarm for X3 Atlas Sphere"
authors = ["Atlas Sphere Team"]
license = "MIT"
repository = "https://github.com/atlas-sphere/atlas-sphere"

[[bin]]
name = "swarm-node"
path = "src/bin/swarm-node.rs"

[[bin]]
name = "swarm-coordinator"
path = "src/bin/swarm-coordinator.rs"

[features]
default = ["cuda"]
cuda = []
opencl = []
metal = []
vulkan = []

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Networking
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "kad", "identify", "ping"] }
quinn = "0.10"
hyper-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
bincode = "1.3"
prost = "0.12"

# Crypto
blake2 = "0.10"
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
getrandom = "0.3"

# Wallet and platform utilities
# (Using simple prototype mnemonic generator in admin for now)
dirs = "4.0"

# GPU abstraction (compile-time features)
wgpu = { version = "23", optional = true }

# Metrics & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14.0"

# HTTP admin UI and web server
axum = "0.7"
hyper = "1.8"
tiny_http = "0.12"
tower-http = { version = "0.4", features = ["fs", "trace"] }

# Utils
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
toml = "0.8"
humantime-serde = "1.1"

# Crypto primitives for wallet and key storage
pbkdf2 = "0.11"
hmac = "0.12"
aes-gcm = "0.10"
argon2 = "0.4"
base64 = "0.21"
once_cell = "1.18"

reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }

# X3 integration
x3-vm = { path = "../x3-vm", optional = true }
x3-mir = { path = "../x3-mir", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
criterion = "0.5"
