## File Organization

```
/etc/x3-relayer/
├── relayer-config-mainnet.yaml     # This file
├── relayer.env                      # Environment variables (secrets)
└── .gitignore                       # Ensure .env never committed

/opt/x3-relayer/
├── bin/
│   └── x3-relayer                  # Compiled binary
├── logs/
│   └── relayer.log                 # Active log
└── data/
    └── metrics.db                  # Optional metrics storage

/var/log/x3-relayer/
├── relayer.log                     # Systemd journal symlink
├── relayer.log.1.gz                # Rotated logs
└── relayer.log.30.gz               # 30 days retention

/var/lib/x3-relayer/
├── proof-cache.db                  # Proof deduplication cache
└── state.json                      # Relayer state (for recovery)
```

