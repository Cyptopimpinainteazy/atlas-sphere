## Configuration Validation

Before starting the relayer, validate the configuration:

```bash
#!/bin/bash
# validate-mainnet-config.sh

echo "=== X3 Relayer Mainnet Configuration Validation ==="
echo ""

# 1. Check required files
if [[ ! -f "$X3_CONFIG_PATH" ]]; then
  echo "❌ Config file not found: $X3_CONFIG_PATH"
  exit 1
fi

# 2. Check YAML syntax
if ! yamllint "$X3_CONFIG_PATH"; then
  echo "❌ YAML syntax error"
  exit 1
fi

# 3. Check required environment variables
for var in X3_RPC_URL X3_RELAYER_ACCOUNT X3_RELAYER_SEED_PHRASE; do
  if [[ -z "${!var}" ]]; then
    echo "❌ Missing environment variable: $var"
    exit 1
  fi
done

# 4. Validate RPC endpoints
echo "Checking RPC endpoints..."

if ! curl -s "$X3_RPC_URL" \
  -H "Content-Type: application/json" \
  -d '{"jsonrpc":"2.0","method":"system_health","params":[],"id":1}' | jq -e '.result.peers' > /dev/null; then
  echo "❌ X3 RPC not responding"
  exit 1
fi

# Extract Alchemy key from config and test
ALCHEMY_KEY=$(grep -oP 'eth-mainnet.g.alchemy.com/v2/\K[^"]+' "$X3_CONFIG_PATH" | head -1)
if ! curl -s "https://eth-mainnet.g.alchemy.com/v2/$ALCHEMY_KEY" \
  -X POST \
  -H "Content-Type: application/json" \
  -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | jq -e '.result' > /dev/null; then
  echo "❌ Ethereum RPC not responding (check Alchemy key)"
  exit 1
fi

echo "✅ Configuration validation passed"
echo ""
echo "Summary:"
echo "  • Config file: $X3_CONFIG_PATH"
echo "  • X3 RPC: $X3_RPC_URL"
echo "  • Relayer account: $X3_RELAYER_ACCOUNT"
echo "  • Ethereum RPC: Alchemy (key configured)"
echo "  • All checks: PASSED"
```

