# X3 Relayer Configuration - Mainnet

**Status:** Template (requires manual configuration)  
**ChainNetwork:** Ethereum Mainnet + Solana Mainnet  
**Created:** 2026-04-21  
**Last Updated:** -  

---

## Configuration Overview

This is the production configuration template for X3 Bridge Relayer on mainnet. 

⚠️ **IMPORTANT:** Replace all placeholder values (`YOUR_*`) before deployment.

### RPC Provider Selection Guide

#### Ethereum Mainnet

Choose from:
1. **Alchemy** (recommended for high throughput)
   - URL: `https://eth-mainnet.g.alchemy.com/v2/{KEY}`
   - Rate limit: Up to 300 requests/second
   - Support: 24/7 professional support

2. **Infura** (popular, reliable)
   - URL: `https://mainnet.infura.io/v3/{KEY}`
   - Rate limit: 100 requests/second (free), up to 400 (paid)
   - Support: 24/7 professional support

3. **QuickNode** (competitive pricing)
   - URL: `https://mainnet.quicknode.pro/?token={KEY}`
   - Rate limit: Depends on plan
   - Support: Community + premium support

4. **Public Node** (free, community-run)
   - URL: `https://ethereum-rpc.publicnode.com`
   - Rate limit: Shared rate limits
   - Support: Community only (not recommended for production)

**Recommendation for Mainnet:**
- Primary: Alchemy (highest reliability)
- Fallback: Infura (industry standard)
- Backup: QuickNode (redundancy)

#### Solana Mainnet

Choose from:
1. **QuickNode** (recommended for mainnet)
   - URL: `https://mainnet.quicknode.pro/?token={KEY}`
   - RPC API: Full standard API

2. **Helius** (Solana-focused)
   - URL: `https://mainnet.helius-rpc.com/?api-key={KEY}`
   - Enhanced APIs available

3. **Triton RPC** (DataCenter tier)
   - URL: `https://api.mainnet-beta.solana.com` (public)
   - Rate limit: Shared public endpoint (not recommended for production)

**Recommendation for Mainnet:**
- Primary: QuickNode (industry standard)
- Fallback: Helius (Solana expertise)
- Backup: Triton (geographic diversity)

