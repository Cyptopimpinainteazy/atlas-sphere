## Performance Tuning

### For High Throughput (Expect 100+ proofs/hour)

```yaml
evm_chains:
  - finality_threshold: 32  # Lower (less safe, faster)
    block_poll_interval_ms: 5000  # More frequent polling
    max_concurrent_requests: 20

svm_clusters:
  - finality_threshold: 64  # Lower threshold
    slot_poll_interval_ms: 3000  # More frequent
    max_concurrent_requests: 100

submission:
  batch_size: 20  # Batch more proofs
  max_retries: 3  # Faster feedback
  retry_backoff_ms: 500  # Quicker retries
```

**Trade-off:** Less safety margin, higher RPC usage, faster throughput

### For Safety (Conservative, Slower)

```yaml
evm_chains:
  - finality_threshold: 128  # Very safe (32 minutes)
    block_poll_interval_ms: 30000  # Poll less frequently
    max_concurrent_requests: 5

svm_clusters:
  - finality_threshold: 256  # Very safe
    slot_poll_interval_ms: 10000  # Poll less frequently
    max_concurrent_requests: 20

submission:
  batch_size: 1  # Submit immediately
  max_retries: 10  # Very persistent
  retry_backoff_ms: 2000  # Slower retries
```

**Trade-off:** Higher safety, lower RPC usage, slower throughput

### Recommended Balance (Default)

Use the provided configuration above (finality_threshold: 64 EVM, 128 SVM).

