## Environment Variables

**Required before startup:**

```bash
# X3 Runtime endpoint
export X3_RPC_URL="https://your-x3-mainnet-rpc.example.com:9933"

# Relayer account (public address)
export X3_RELAYER_ACCOUNT="0x1234567890123456789012345678901234567890"

# Relayer seed phrase (use vault/secrets manager, not shell history)
export X3_RELAYER_SEED_PHRASE="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

# Configuration file path
export X3_CONFIG_PATH="/etc/x3-relayer/relayer-config-mainnet.yaml"

# Log level (debug, info, warn, error)
export X3_LOG_LEVEL="info"

# Rust logging (fine-grained control)
export RUST_LOG="x3_relayer=info,x3_chain_runtime=info,tokio=warn"
```

**Optional:**

```bash
# Metrics export endpoint
export X3_METRICS_PORT="9999"

# Profiling (disabled in production)
export X3_PROFILE_PORT="6060"

# Health check endpoint
export X3_HEALTH_CHECK_PORT="8888"
```

