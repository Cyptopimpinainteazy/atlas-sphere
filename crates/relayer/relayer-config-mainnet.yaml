## Secrets Management

### Option 1: HashiCorp Vault (Recommended)

```bash
# Store secrets in Vault
vault kv put secret/x3-relayer/mainnet \
  X3_RELAYER_SEED_PHRASE="abandon abandon..." \
  ALCHEMY_KEY="YOUR_KEY" \
  INFURA_KEY="YOUR_KEY" \
  QUICKNODE_KEY="YOUR_KEY" \
  HELIUS_KEY="YOUR_KEY"

# At startup, fetch and export
eval "$(vault kv get -format=json secret/x3-relayer/mainnet | \
  jq -r '.data.data | to_entries[] | "export \(.key)=\(.value)"')"

# Then start relayer
./x3-relayer
```

### Option 2: AWS Secrets Manager

```bash
# Store secrets
aws secretsmanager create-secret \
  --name x3-relayer-mainnet \
  --secret-string '{
    "X3_RELAYER_SEED_PHRASE": "abandon abandon...",
    "ALCHEMY_KEY": "YOUR_KEY",
    "INFURA_KEY": "YOUR_KEY"
  }'

# At startup, fetch and export
eval "$(aws secretsmanager get-secret-value \
  --secret-id x3-relayer-mainnet \
  --query SecretString \
  --output text | \
  jq -r 'to_entries[] | "export \(.key)=\(.value)"')"

# Then start relayer
./x3-relayer
```

### Option 3: .env File (Development Only, NOT for Production)

```bash
# .env file (NEVER commit to git)
X3_RPC_URL="https://..."
X3_RELAYER_ACCOUNT="0x..."
X3_RELAYER_SEED_PHRASE="abandon abandon..."
X3_LOG_LEVEL="info"

# Load via dotenv
source .env
./x3-relayer
```

⚠️ **.env files should NEVER be used in production. Use Vault or Secrets Manager.**

