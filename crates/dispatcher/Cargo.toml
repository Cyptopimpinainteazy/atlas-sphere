[package]
name = "dispatcher"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
k256 = { version = "0.11", features = ["ecdsa"] }
rand = { version = "0.8", features = ["std"] , optional = true }
[features]
default = []
# Expose helpers useful for testing and in-crate dev/test utilities
# Enable this feature in consuming crates' dev-dependencies to access `dispatcher::test_utils`.
test-helpers = []
test_rng = ["rand"]
