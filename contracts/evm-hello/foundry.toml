[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fuzz = { runs = 1000, max_test_rejects = 65536 }

remappings = [
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
