[profile.default]
src = "src"
out = "out"
libs = ["../@openzeppelin", "../forge-std", "lib"]
solc = "0.8.22"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
allow_paths = ["..", "../@openzeppelin", "../forge-std"]

# Remappings
remappings = [
    "@openzeppelin/contracts/=/home/lojak/Desktop/x3-chain-master/contracts/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=/home/lojak/Desktop/x3-chain-master/contracts/@openzeppelin/contracts-upgradeable/",
    "forge-std/=/home/lojak/Desktop/x3-chain-master/contracts/forge-std/src/",
]

# Testing
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

# Gas reports
gas_reports = ["AISwarmCoordinator", "GPUMarketplace", "PredictionMarket"]

# Formatting
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

# CI profile
[profile.ci]
fuzz = { runs = 10000 }
verbosity = 4

# Deployment
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}" }
optimism = { key = "${OPTIMISTIC_ETHERSCAN_API_KEY}" }
