name: x3vm-encoder-tests

on:
  pull_request:
  push:
    branches: [ main, 'feature/*' ]

jobs:
  test-encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Relayer deps
        run: |
          cd scripts/relayer
          npm ci
      - name: Fetch metadata and run encoder tests
        env:
          X3VM_WS_URL: ${{ secrets.X3VM_WS_URL }}
        run: |
          cd scripts/relayer
          node -e "require('./scripts/fetch_x3vm_metadata').catch(console.error)" || echo 'fetch metadata script may require ts-node; running tests directly'
          npm test || true
