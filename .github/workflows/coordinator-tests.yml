name: Coordinator tests (unit)

on:
  push:
    paths:
      - 'scripts/coordinator/**'
  pull_request:
    paths:
      - 'scripts/coordinator/**'

jobs:
  coordinator-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/coordinator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coordinator unit tests (transpile-only)
        env:
          TS_NODE_TRANSPILE_ONLY: 'true'
        run: |
          echo "Running targeted coordinator tests..."
          ./node_modules/.bin/mocha --require ts-node/register tests/uas.test.ts tests/utils.test.ts --exit
