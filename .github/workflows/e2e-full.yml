name: e2e-full

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      ADAPTER_PORT: 4001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install adapter deps
        run: |
          cd apps/blockchain-adapter
          npm ci
      - name: Deploy EVM Provenance contract
        env:
          EVM_RPC_URL: ${{ secrets.EVM_RPC_URL }}
          EVM_DEPLOYER_PRIVATE_KEY: ${{ secrets.EVM_DEPLOYER_PRIVATE_KEY }}
        run: |
          cd apps/blockchain-adapter
          npm run deploy-contracts
      - name: Run relayer tests and encoder
        env:
          X3VM_WS_URL: ${{ secrets.X3VM_WS_URL }}
        run: |
          cd scripts/relayer
          npm ci
          node -e "require('./scripts/fetch_x3vm_metadata').catch(console.error)"
          npm test
      - name: Start adapter & run e2e
        env:
          EVM_DEPLOYER_PRIVATE_KEY: ${{ secrets.EVM_DEPLOYER_PRIVATE_KEY }}
          X3VM_WS_URL: ${{ secrets.X3VM_WS_URL }}
          X3VM_SIGNER_SURI: ${{ secrets.X3VM_SIGNER_SURI }}
          EVM_RPC_URL: ${{ secrets.EVM_RPC_URL }}
        run: |
          cd apps/blockchain-adapter
          npm run start &
          sleep 3
          npm test --silent

# Requires repository secrets: EVM_RPC_URL, EVM_DEPLOYER_PRIVATE_KEY, X3VM_WS_URL, X3VM_SIGNER_SURI
