name: swarm-media-integration

on:
  pull_request:
    paths:
      - 'crates/swarm-media/**'
      - 'alembic/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88.0
          profile: minimal
          override: true

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/atlas_test" >> $GITHUB_ENV

      - name: Run Alembic migrations (if present)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          if [ -f alembic.ini ]; then
            pip install alembic
            alembic upgrade head
          else
            echo "No alembic.ini found, creating tables via SQL in test setup"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run swarm-media tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -e
          cd crates/swarm-media
          cargo test --lib -- --nocapture
