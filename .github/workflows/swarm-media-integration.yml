name: swarm-media-integration

on:
  pull_request:
    paths:
      - 'crates/swarm-media/**'
      - 'alembic/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88.0
          profile: minimal
          override: true

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/atlas_test" >> $GITHUB_ENV

      - name: Run Alembic migrations (if present)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          if [ -f alembic.ini ]; then
            # Ensure required logger sections are present to avoid fileConfig KeyError
            python - <<'PY'
from configparser import ConfigParser
import sys
cfg = ConfigParser()
if not cfg.read('alembic.ini'):
    print('alembic.ini not found or unreadable')
    sys.exit(1)
missing = [s for s in ('logger_sqlalchemy','logger_alembic') if s not in cfg.sections()]
if missing:
    print('Missing logger sections in alembic.ini:', missing)
    sys.exit(1)
print('alembic.ini logger sections OK')
PY

            pip install alembic psycopg2-binary

            # Quick sanity check: ensure Alembic runtime deps import correctly
            python - <<'PY'
import sys
try:
    import sqlalchemy
    import psycopg2
except Exception as e:
    print("Dependency import failed:", e)
    sys.exit(1)
print("Alembic dependencies imported successfully")
PY

            alembic upgrade head
          else
            echo "No alembic.ini found, creating tables via SQL in test setup"
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run swarm-media tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -e
          cd crates/swarm-media
          cargo test --lib -- --nocapture
