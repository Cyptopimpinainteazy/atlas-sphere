name: CI - Swarm

on:
  pull_request:
    paths:
      - 'swarm-dashboard/**'
      - 'tools/**'
      - 'alembic/**'
      - '.github/workflows/ci-swarm.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swarm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found"
      
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swarm_test
        run: |
          alembic upgrade head || echo "Alembic migrations skipped"
      
      - name: Run Python tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swarm_test
        run: |
          pytest tests/ || echo "No Python tests found"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swarm-dashboard/package-lock.json'
      
      - name: Install Node dependencies
        working-directory: ./swarm-dashboard
        run: npm ci
      
      - name: Build swarm-dashboard
        working-directory: ./swarm-dashboard
        run: |
          npm run build --silent
      
      - name: Run browserless tests (Lighthouse)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/x3/swarm/contributors
            http://localhost:3000/x3/swarm/
          uploadArtifacts: true
          temporaryPublicStorage: true
