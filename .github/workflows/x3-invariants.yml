name: x3-invariants

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: cargo build
        run: cargo build --all --locked --workspace
      - name: Upload build log
        if: failure()
        run: echo "See cargo build output in job logs"

  tla-check:
    name: TLA+ checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run TLA+ checks (Apalache via script)
        run: |
          echo "Running TLA+ checks using scripts/ci/tla_check.sh"
          mkdir -p ./artifacts
          chmod +x ./scripts/ci/tla_check.sh
          ./scripts/ci/tla_check.sh
      - name: Upload tla-check log
        uses: actions/upload-artifact@v4
        with:
          name: tla-check-log
          path: ./artifacts/tla-check.log

  x3-invariants:
    name: x3-invariants
    runs-on: ubuntu-latest
    needs: [tla-check, simulator-replay, slashing-property-test]
    steps:
      - name: All invariants passed
        run: |
          echo "All x3 invariants jobs passed" > ./artifacts/x3-invariants.txt
          ls -la ./artifacts || true
      - name: Upload x3-invariants artifact
        uses: actions/upload-artifact@v4
        with:
          name: x3-invariants
          path: ./artifacts/x3-invariants.txt

  simulator-replay:
    name: Deterministic Simulator Replay
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build workspace
        run: cargo build --all --locked --workspace
      - name: Run simulator replay test
        run: |
          echo "Running simulator replay tests"
          mkdir -p ./artifacts
          # Run the simulator integration test and capture output
          cargo test -p x3-evolution --test simulator_replay -- --nocapture 2>&1 | tee ./artifacts/simulator.log
      - name: Upload simulator log
        uses: actions/upload-artifact@v4
        with:
          name: simulator-log
          path: ./artifacts/simulator.log

  slashing-property-test:
    name: Slashing property tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run slashing property tests
        run: |
          echo "Running slashing property tests"
          mkdir -p ./artifacts
          cargo test -p swarm-media --test slashing_properties -- --nocapture 2>&1 | tee ./artifacts/slashing.log
      - name: Upload slashing log
        uses: actions/upload-artifact@v4
        with:
          name: slashing-log
          path: ./artifacts/slashing.log
