name: swarm-dashboard e2e

on:
  pull_request:
    paths:
      - 'swarm-dashboard/**'
      - '.github/workflows/swarm-dashboard-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swarm-dashboard/package-lock.json'
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: swarm-dashboard/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('swarm-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('swarm-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies
        working-directory: ./swarm-dashboard
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund
      
      - name: Run type checking
        working-directory: ./swarm-dashboard
        run: npm run type-check || true
      
      - name: Install Playwright Browsers
        working-directory: ./swarm-dashboard
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        working-directory: ./swarm-dashboard
        run: npm run e2e:test || true

      - name: Check Axe violations and comment on PR
        id: check_axe
        if: always()
        run: |
          echo "Checking for axe violations artifact..."
          if [ -f swarm-dashboard/e2e/axe-violations.json ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            summary=$(jq -r '.[] | "- \(.id) (impact: \(.impact)) — \(.nodes|length) nodes"' swarm-dashboard/e2e/axe-violations.json | sed ':a;N;$!ba;s/\n/\\n/g')
            body="Axe accessibility check reported violations on this run:\n\n${summary}\n\nFull JSON attached as an artifact: \`axe-violations.json\`"
            echo "Posting comment to PR #${{ github.event.pull_request.number }}"
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -X POST -d "{\"body\": \"${body//"/\\\"}\"}" "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload axe violations artifact
        if: steps.check_axe.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: axe-violations
          path: swarm-dashboard/e2e/axe-violations.json
