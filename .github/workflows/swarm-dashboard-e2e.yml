name: swarm-dashboard e2e

on:
  pull_request:
    paths:
      - 'swarm-dashboard/**'
      - '.github/workflows/swarm-dashboard-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'swarm-dashboard/package-lock.json'
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: swarm-dashboard/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('swarm-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('swarm-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies
        working-directory: ./swarm-dashboard
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund
      
      - name: Run type checking
        working-directory: ./swarm-dashboard
        run: npm run type-check || true
      
      - name: Install Playwright Browsers
        working-directory: ./swarm-dashboard
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        working-directory: ./swarm-dashboard
        run: npm run test:e2e || true
