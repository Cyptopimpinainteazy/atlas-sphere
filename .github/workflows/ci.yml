name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - copilot/**
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  prod-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (prod-faithful defaults)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo tests (release, prod-faithful defaults)
        run: cargo test --workspace --release

      - name: Parser crate tests
        run: cargo test -p x3-parser --release

      - name: Run extended test suite
        run: |
          chmod +x ./RUN_ALL_TESTS.sh
          ./RUN_ALL_TESTS.sh

      - name: Build runtime WASM (no_std compatibility)
        run: cargo build -p atlas-sphere-runtime --release --target wasm32-unknown-unknown --no-default-features

  feature-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo tests (release, all features)
        run: cargo test --workspace --release --all-features

      - name: Parser crate tests (all features)
        run: cargo test -p x3-parser --release --all-features
