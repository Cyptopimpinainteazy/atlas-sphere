# CodeRabbit Configuration
language: "en-US"

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop

  high_level_summary: true
  poem: false
  
  path_filters:
    - "!**/node_modules/**"
    - "!**/target/**"
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/artifacts/**"
    - "!**/vendor/**"

  path_instructions:
    - path: "**/*.rs"
      instructions: "Focus on memory safety, error handling, and security."
    - path: "**/*.sol"
      instructions: "Focus on reentrancy, overflow, access control, gas optimization."
    - path: "**/pallets/**/*.rs"
      instructions: "Substrate pallet - check weights, storage, ensure!, events, origins."

chat:
  auto_reply: true