# X3 Contract Safety Rules
# This file defines what AI-generated code may and may not do.
# The verifier enforces these rules at compile time.

version: "1.0"
schema: "contract-safety/v1"

# =============================================================================
# OPCODE CLASSIFICATION
# =============================================================================

opcodes:
  # Safe operations - always allowed
  safe:
    arithmetic:
      - add
      - sub
      - mul
      - div
      - mod
      - neg
    bitwise:
      - and
      - or
      - xor
      - not
      - shl
      - shr
    comparison:
      - eq
      - neq
      - lt
      - lte
      - gt
      - gte
    memory:
      - load        # Register/stack load
      - store       # Register/stack store
      - mov
      - const
    control_flow:
      - jump
      - jump_if
      - jump_unless
      - call_internal
      - return
    state:
      - state_load
      - state_store
    atomic:
      - atomic_begin
      - atomic_end
    events:
      - emit_event
    safety:
      - assert
      - revert
    crypto:
      - hash_keccak256
      - hash_sha256
      - hash_blake2
    misc:
      - nop
      - comment

  # Restricted operations - require explicit permit and justification
  restricted:
    - evm_call     # Cross-VM calls need audit
    - svm_call     # Cross-VM calls need audit
    - call         # External calls need review

  # Forbidden operations - never allowed in AI-generated code
  forbidden:
    - raw_call           # Arbitrary external call
    - unbounded_loop     # Loop without gas bound
    - host_fs            # Filesystem access
    - host_network       # Network I/O
    - jmp_dyn            # Dynamic jump target
    - eval               # Dynamic code evaluation
    - rand               # Non-deterministic randomness
    - timestamp_unsafe   # Manipulable timestamp
    - block_hash_far     # Hash of block > 256 ago

# =============================================================================
# GAS LIMITS
# =============================================================================

gas:
  # Per-operation gas costs (base costs)
  costs:
    add: 3
    sub: 3
    mul: 5
    div: 5
    mod: 5
    load: 3
    store: 5
    state_load: 100
    state_store: 5000
    jump: 8
    jump_if: 10
    call_internal: 40
    call: 700
    evm_call: 2100
    svm_call: 5000
    atomic_begin: 100
    atomic_end: 100
    hash_keccak256: 30
    hash_sha256: 60
    hash_blake2: 30
    emit_event: 375
    assert: 10
    revert: 0
    return: 0

  # Limits
  limits:
    max_function_gas: 10_000_000   # 10M gas per function
    max_atomic_gas: 5_000_000      # 5M gas per atomic block
    max_loop_iterations: 10_000    # Bounded loops only
    max_call_depth: 64             # Prevent stack overflow
    max_storage_slots: 1000        # Per contract
    max_event_topics: 4            # Per event

# =============================================================================
# DETERMINISM RULES
# =============================================================================

determinism:
  # These must be true for on-chain execution
  requirements:
    - no_floating_point            # Unless explicitly marked
    - no_randomness                # No RNG
    - no_external_io               # No network/filesystem
    - no_time_dependency           # Use block number, not timestamp
    - no_uninitialized_memory      # All reads must have prior writes
    - fixed_iteration_bounds       # All loops must have bounds
    - reproducible_hash_order      # Use ordered collections

  # Allowed non-determinism (off-chain only)
  off_chain_only:
    - floating_point_math
    - random_sampling
    - external_data_fetch
    - timestamp_access

# =============================================================================
# ATOMIC BLOCK RULES
# =============================================================================

atomic:
  # Rules for atomic { } blocks (cross-VM transactions)
  requirements:
    - pre_verified_gas             # Gas must be estimable before execution
    - no_nested_atomic             # Cannot nest atomic blocks
    - all_or_nothing               # Must fully commit or fully revert
    - max_vm_count: 2              # At most 2 VMs per atomic block
    - timeout_bound: 30_000        # 30 second maximum

  # What can be inside atomic blocks
  allowed_inside:
    - state_load
    - state_store
    - evm_call
    - svm_call
    - arithmetic
    - comparison
    - assert
    - revert
    - emit_event

  # What cannot be inside atomic blocks
  forbidden_inside:
    - unbounded_loop
    - external_call_unverified
    - dynamic_dispatch

# =============================================================================
# AI GENERATION RULES
# =============================================================================

ai_generation:
  # Required metadata for AI-generated code
  required_metadata:
    - seed                         # Deterministic seed
    - prompt_hash                  # Hash of input prompt
    - model_id                     # Which model generated
    - generation_timestamp         # When generated
    - safety_version               # This schema version

  # Verification requirements
  verification:
    - static_analysis_pass         # Must pass static verifier
    - gas_estimation_pass          # Gas must be calculable
    - forbidden_ops_check          # No forbidden ops
    - determinism_check            # Must be deterministic
    - type_check                   # All types must resolve

  # Auto-rejection criteria
  auto_reject:
    - contains_forbidden_op
    - exceeds_gas_limit
    - unbounded_recursion
    - missing_return_path
    - type_mismatch
    - unresolved_reference

  # Warnings (don't reject, but flag)
  warnings:
    - high_gas_cost               # > 1M gas
    - complex_control_flow        # > 20 branches
    - deep_nesting                # > 10 levels
    - large_storage_footprint     # > 100 slots
    - unused_parameters
    - unused_storage

# =============================================================================
# MUTATION ENGINE RULES
# =============================================================================

mutation:
  # What can be mutated
  allowed:
    - constant_values             # Numeric constants
    - arithmetic_operators        # +, -, *, /
    - comparison_operators        # <, >, ==, etc.
    - branch_conditions           # if/else logic
    - loop_bounds                 # Iteration counts
    - function_inlining           # Inline small functions

  # What cannot be mutated
  forbidden:
    - add_forbidden_ops           # Can't add unsafe ops
    - remove_safety_checks        # Can't remove asserts
    - change_visibility           # Can't make private public
    - modify_atomic_bounds        # Can't change atomic blocks
    - alter_storage_layout        # Storage is fixed

  # Mutation limits
  limits:
    max_mutations_per_generation: 5
    min_test_coverage: 0.8        # 80% coverage required
    max_gas_increase_percent: 20  # Can't increase gas > 20%

# =============================================================================
# SIGNATURE AND RECEIPT RULES
# =============================================================================

signatures:
  # Required for vault-able strategies
  receipt_format:
    version: "1.0"
    fields:
      - contract_hash             # Blake2 hash of bytecode
      - mir_hash                  # Blake2 hash of MIR JSON
      - source_hash               # Blake2 hash of X3 source
      - ai_seed                   # Generation seed
      - verifier_version          # Verifier that approved
      - test_results_hash         # Hash of test output
      - simulation_results        # Swarm sim results if any
      - timestamp                 # Generation time
      - signature                 # Ed25519 signature

  # Who can sign
  signers:
    - verifier_service            # Automated verifier
    - auditor_key                 # Human auditor
    - governance_multisig         # DAO approval

# =============================================================================
# ERROR CODES
# =============================================================================

errors:
  E001: "Forbidden opcode detected"
  E002: "Gas limit exceeded"
  E003: "Unbounded loop detected"
  E004: "Non-deterministic operation"
  E005: "Missing return path"
  E006: "Type mismatch"
  E007: "Unresolved reference"
  E008: "Atomic block violation"
  E009: "Storage limit exceeded"
  E010: "Call depth exceeded"
  E011: "Missing safety metadata"
  E012: "Invalid AI generation seed"
  E013: "Mutation rule violation"
  E014: "Signature verification failed"
  E015: "Unsafe operation without justification"
