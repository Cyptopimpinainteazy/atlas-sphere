# ──────────────────────────────────────────────────────────────────
# DEPIN-GPU-001: DePIN GPU Marketplace
# Proposal: openspec/changes/DEPIN-GPU-001/proposal.md
# ──────────────────────────────────────────────────────────────────

[[invariant]]
id = "DEPIN-MARKET-001"
description = "Block-building work always preempts marketplace jobs within 2ms"
severity = "CRITICAL"
layer = "CONSENSUS"
tested_by = ["tests/depin/test_preemption.rs::preemption_within_deadline"]
property = "preempt_latency <= 2ms"

[[invariant]]
id = "DEPIN-MARKET-002"
description = "Revenue split exactly matches configured BPS (validator + burn + staker = 10000)"
severity = "CRITICAL"
layer = "PALLET"
tested_by = ["pallets/depin-marketplace/src/tests.rs::revenue_split_conservation"]
property = "validator_share + burn_share + staker_share == total_revenue"

[[invariant]]
id = "DEPIN-MARKET-003"
description = "Customer escrow is locked before job assignment and released only on completion or timeout"
severity = "CRITICAL"
layer = "PALLET"
tested_by = ["pallets/depin-marketplace/src/tests.rs::escrow_lifecycle"]
property = "lock(escrow) -> assigned -> (complete|timeout) -> release(escrow)"

[[invariant]]
id = "DEPIN-MARKET-004"
description = "Sandboxed GPU workloads cannot access host memory outside allocated VRAM region"
severity = "CRITICAL"
layer = "INFRA"
tested_by = ["tests/depin/test_sandbox.rs::memory_isolation"]
property = "forall rental_job: accessible_memory ⊆ allocated_vram_region"

[[invariant]]
id = "DEPIN-MARKET-005"
description = "Provider stake is slashed on verified job failure"
severity = "HIGH"
layer = "PALLET"
tested_by = ["pallets/depin-marketplace/src/tests.rs::slash_on_failure"]
property = "job_failed && verified => provider.stake -= slash_amount"

# ──────────────────────────────────────────────────────────────────
# EXEC-PREDICT-002: Predictive Parallel Execution with On-Device ML
# Proposal: openspec/changes/EXEC-PREDICT-002/proposal.md
# ──────────────────────────────────────────────────────────────────

[[invariant]]
id = "EXEC-PREDICT-001"
description = "Prediction inference latency is ≤0.5ms for batches up to 10K transactions"
severity = "HIGH"
layer = "CONSENSUS"
tested_by = ["crates/contention-predictor/benches/inference_latency.rs::latency_under_budget"]
property = "predict(batch_10k).latency <= 500μs"

[[invariant]]
id = "EXEC-PREDICT-002"
description = "Fallback to serial execution when prediction confidence is below threshold"
severity = "CRITICAL"
layer = "CONSENSUS"
tested_by = ["crates/contention-predictor/tests/fallback.rs::low_confidence_serial"]
property = "confidence < threshold => serial_execution"

[[invariant]]
id = "EXEC-PREDICT-003"
description = "Shard groups are disjoint — no transaction appears in multiple shards"
severity = "CRITICAL"
layer = "VM"
tested_by = ["crates/contention-predictor/tests/shard_planner.rs::shards_disjoint"]
property = "forall i,j where i≠j: shard[i] ∩ shard[j] = ∅"

[[invariant]]
id = "EXEC-PREDICT-004"
description = "Predicted execution produces identical state root to serial execution"
severity = "CRITICAL"
layer = "VM"
tested_by = ["tests/integration/predictive_exec.rs::parallel_matches_serial"]
property = "state_root(parallel_sharded) == state_root(serial)"

[[invariant]]
id = "EXEC-PREDICT-005"
description = "Model weights are loaded only from governance-approved hash"
severity = "HIGH"
layer = "CONSENSUS"
tested_by = ["crates/contention-predictor/tests/model_integrity.rs::reject_unapproved_weights"]
property = "load_model(weights) => hash(weights) in approved_set"

# ──────────────────────────────────────────────────────────────────
# PRIV-ENCLAVE-003: Embedded Private Execution Environments
# Proposal: openspec/changes/PRIV-ENCLAVE-003/proposal.md
# ──────────────────────────────────────────────────────────────────

[[invariant]]
id = "PRIV-EXEC-001"
description = "Private TX content is never exposed in plaintext outside the enclave"
severity = "CRITICAL"
layer = "CONSENSUS"
tested_by = ["tests/private_execution/test_confidentiality.rs::no_plaintext_leak"]
property = "forall private_tx: plaintext only inside attested enclave memory"

[[invariant]]
id = "PRIV-EXEC-002"
description = "Encrypted state diff when applied produces identical state to public execution of same TX"
severity = "CRITICAL"
layer = "VM"
tested_by = ["tests/private_execution/test_correctness.rs::private_matches_public"]
property = "apply(decrypt(encrypted_diff)) == apply(public_execute(tx))"

[[invariant]]
id = "PRIV-EXEC-003"
description = "No single validator can decrypt a private TX alone (threshold t-of-n required)"
severity = "CRITICAL"
layer = "CONSENSUS"
tested_by = ["crates/confidential-gpu/tests/threshold.rs::single_share_insufficient"]
property = "decrypt(ciphertext, [share]) fails when |[share]| < t"

[[invariant]]
id = "PRIV-EXEC-004"
description = "Enclave attestation is verified before validator joins confidential set"
severity = "CRITICAL"
layer = "CONSENSUS"
tested_by = ["pallets/private-execution/src/tests.rs::reject_unattested"]
property = "register_confidential(validator) requires valid_attestation(validator)"

[[invariant]]
id = "PRIV-EXEC-005"
description = "Private execution premium fee is correctly collected and split"
severity = "HIGH"
layer = "PALLET"
tested_by = ["pallets/private-execution/src/tests.rs::fee_premium_accounting"]
property = "fee_collected == base_fee * (1 + premium_bps / 10000)"

[[invariant]]
id = "PRIV-EXEC-006"
description = "Regional finality latency increase from private execution is ≤1ms"
severity = "HIGH"
layer = "CONSENSUS"
tested_by = ["tests/private_execution/benches/latency.rs::finality_overhead"]
property = "finality_latency(private) - finality_latency(public) <= 1ms"
