version: '3.8'

services:
  # Ollama service - Local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: substreams-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-init.sh:/docker-entrypoint.sh
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - substreams-llm
    restart: unless-stopped

  # LLM Router Service - Routes queries to Ollama or OpenRouter
  llm-router:
    build:
      context: .
      dockerfile: Dockerfile.llm-service
    container_name: substreams-llm-router
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./llm-config.json:/app/llm-config.json:ro
      - ./llm-service:/app:ro
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - substreams-llm
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local

networks:
  substreams-llm:
    driver: bridge
