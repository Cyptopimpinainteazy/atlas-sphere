version: '3.8'

services:
  # Dashboard application
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_WS_BASE_URL: ws://localhost:5000/ws
    depends_on:
      - api
    networks:
      - atlas-sphere
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Mock API backend (for development)
  api:
    image: lsociety/mock-api:latest
    ports:
      - "5000:5000"
    environment:
      MOCK_PORT: "5000"
      CORS_ENABLED: "true"
    networks:
      - atlas-sphere
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Reverse proxy (nginx)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - dashboard
      - api
    networks:
      - atlas-sphere

  # Database (optional - for local API data)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: gpu_swarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atlas-sphere

  # Redis (optional - for caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - atlas-sphere
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Prometheus (optional - for monitoring)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - atlas-sphere

volumes:
  postgres_data:
  prometheus_data:

networks:
  atlas-sphere:
    driver: bridge
