<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Real-time GPU Swarm monitoring and management dashboard" />
    <title>GPU Swarm Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: #020617;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-display" style="position: absolute; top: 0; left: 0; width: 100%; border: 2px solid #ff0000; background: #ff0000; color: white; padding: 20px; display: none;"></div>
    <script>
      window.addEventListener('error', (event) => {
        const errorDiv = document.getElementById('error-display');
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = '<h2>JavaScript Error</h2><pre>' + event.error.stack + '</pre>';
        console.error('Caught error:', event.error);
      });
      
      window.addEventListener('unhandledrejection', (event) => {
        const errorDiv = document.getElementById('error-display');
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = '<h2>Unhandled Promise Rejection</h2><pre>' + event.reason + '</pre>';
        console.error('Caught rejection:', event.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
