version: '3.8'

services:
  # Main dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_WS_BASE_URL: ws://localhost:5000/ws
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.vite
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Development API mock server
  api-mock:
    image: mockoon/mockoon:latest
    ports:
      - "5000:3000"
    environment:
      PORT: "3000"
    volumes:
      - ./mock-api.json:/data/mock-api.json:ro
    networks:
      - dev
    command: -d /data/mock-api.json --host 0.0.0.0

  # Database for mock data
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dashboard_dev
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - dev

volumes:
  db_data:

networks:
  dev:
    driver: bridge
