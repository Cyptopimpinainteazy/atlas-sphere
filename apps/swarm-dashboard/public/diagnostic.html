<!DOCTYPE html>
<html>
<head>
  <title>Diagnostic</title>
  <style>
    body { background: #020617; color: white; font-family: monospace; padding: 20px; }
    .ok { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>Development Server Diagnostic</h1>
  <p>✓ Server is responding</p>
  <p>✓ HTML is loading</p>

  <h2>Dev Server Details</h2>
  <p>Port: 5174</p>
  <p>Time: <span id="time"></span></p>
  
  <script>
    document.getElementById('time').textContent = new Date().toLocaleTimeString();
    console.log('Diagnostic page loaded');
  </script>
</body>
</html>
