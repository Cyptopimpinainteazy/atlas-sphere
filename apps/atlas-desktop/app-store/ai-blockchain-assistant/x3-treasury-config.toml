# AI Blockchain Assistant Treasury Configuration

[treasury]
enabled = true
x3_treasury_address = "X3Treasury_Multi_Chain_Address"
treasury_share = 50  # 50% of all service fees

[service_fees]
# Fees for AI services
query_fee = 0.001  # ETH per query
analysis_fee = 0.01  # ETH per contract analysis
automation_fee = 0.05  # ETH per automated task
trading_assistant_fee_percentage = 2.0  # 2% of trade value

[treasury_routing]
auto_transfer = true
minimum_transfer_amount = 0.01  # ETH
transfer_interval_blocks = 100

[chains]
ethereum = "0xX3_TREASURY_ETH"
bsc = "0xX3_TREASURY_BSC"
polygon = "0xX3_TREASURY_POLYGON"
arbitrum = "0xX3_TREASURY_ARB"

[logging]
enabled = true
log_file = "./logs/treasury-transactions.log"
verbose = true
