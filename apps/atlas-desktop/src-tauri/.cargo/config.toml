[build]
# Use Clang instead of GCC to avoid zstd-sys segmentation faults
rustflags = ["-C", "linker=clang"]

[env]
# Environment variables for Clang compilation
CC = { value = "clang", relative = false }
CXX = { value = "clang++", relative = false }
# Reduced optimization for faster builds and fewer compiler crashes
CFLAGS = { value = "-O2 -fPIC", relative = false }
CXXFLAGS = { value = "-O2 -fPIC", relative = false }
