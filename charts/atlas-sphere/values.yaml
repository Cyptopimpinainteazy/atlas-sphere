replicaCount: 2

image:
  repository: ghcr.io/${{ github.repository_owner }}/atlas-sphere
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

postgres:
  enabled: false
  url: "" # override with POSTGRES_URL via Helm --set or secret

prometheus:
  enabled: true
  scrapeInterval: 15s
