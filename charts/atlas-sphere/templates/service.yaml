apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas-sphere.fullname" . }}
  labels:
    app: atlas-sphere
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: atlas-sphere
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ .Values.service.port }}
