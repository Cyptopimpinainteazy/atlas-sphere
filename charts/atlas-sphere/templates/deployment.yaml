apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas-sphere.fullname" . | trunc 63 }}
  labels:
    app: atlas-sphere
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: atlas-sphere
  template:
    metadata:
      labels:
        app: atlas-sphere
    spec:
      containers:
        - name: atlas-sphere
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: POSTGRES_URL
              value: "{{ .Values.postgres.url }}"
          resources:
{{ toYaml .Values.resources | indent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
