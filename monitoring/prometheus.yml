# Prometheus Configuration for Phase 5 Jury Blockchain Anchoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'atlas-jury-phase5'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Rule files
rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Blockchain RPC Node
  - job_name: 'blockchain-node'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9644']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'blockchain-rpc'

  # Jury Service
  - job_name: 'jury-service'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:8080']
    relabel_configs:
      - source_labels: [__scheme__, __address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9100

  # Jury Anchorer Service
  - job_name: 'jury-anchorer'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'jury-anchorer'

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'jury-postgres'

  # Docker Container Metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-daemon'

# Recording rules for computed metrics
recording_rules:
  - name: jury_anchoring:5m
    interval: 5m
    rules:
      - record: jury:anchor_success_rate:5m
        expr: rate(jury_anchoring_success_total[5m]) / rate(jury_anchoring_total[5m])
      
      - record: jury:anchor_latency:5m
        expr: histogram_quantile(0.95, rate(jury_anchoring_latency_seconds_bucket[5m]))
      
      - record: jury:decision_processing_time:5m
        expr: histogram_quantile(0.95, rate(jury_decision_processing_seconds_bucket[5m]))

  - name: blockchain:metrics:5m
    interval: 5m
    rules:
      - record: blockchain:rpc_response_time:5m
        expr: histogram_quantile(0.95, rate(substrate_rpc_responses_duration_bucket[5m]))
      
      - record: blockchain:block_time:5m
        expr: rate(substrate_block_height_total[5m])

  - name: database:metrics:5m
    interval: 5m
    rules:
      - record: postgres:query_latency:5m
        expr: histogram_quantile(0.95, rate(pg_stat_statements_query_time_sum[5m]))
      
      - record: postgres:connection_count:5m
        expr: pg_stat_activity_count

# Alert Rules (in separate file: alert_rules.yml)
# This should contain:
# - Anchor failure rate > 5%
# - Blockchain sync ratio < 90%
# - Database connection errors
# - Service unavailability
# - High latency (>10s)
# - Memory/CPU thresholds
