# Prometheus Alert Rules for Phase 5

groups:
  - name: jury_anchoring
    interval: 30s
    rules:
      # High anchor latency
      - alert: HighAnchorLatency
        expr: histogram_quantile(0.95, jury_anchor_duration_seconds) > 10
        for: 5m
        labels:
          severity: warning
          component: jury-anchorer
        annotations:
          summary: "High anchor latency detected"
          description: "P95 anchor latency is {{ $value }}s (target: <5s)"

      # Low success rate
      - alert: LowAnchorSuccessRate
        expr: |
          (rate(jury_anchor_success_total[5m]) / rate(jury_anchor_attempts_total[5m])) < 0.99
        for: 5m
        labels:
          severity: critical
          component: jury-anchorer
        annotations:
          summary: "Low anchor success rate"
          description: "Success rate is {{ $value | humanizePercentage }} (target: >99%)"

      # High verification failure rate
      - alert: HighVerificationFailures
        expr: rate(jury_verify_failures_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
          component: jury-anchoring
        annotations:
          summary: "High verification failure rate"
          description: "Failure rate: {{ $value | humanize }}/sec"

      # RPC node not syncing
      - alert: RpcNodeNotSyncing
        expr: substrate_blocks_finalized == 0
        for: 10m
        labels:
          severity: critical
          component: blockchain-rpc
        annotations:
          summary: "RPC node not syncing"
          description: "Blockchain RPC has not finalized blocks in 10 minutes"

      # Database connection pool exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          postgresql_connections_available < 5 and postgresql_connections_total > 15
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool low"
          description: "Available connections: {{ $value }} (total: {{ $value_total }})"

      # High database query latency
      - alert: HighDatabaseLatency
        expr: histogram_quantile(0.95, pg_query_duration_seconds) > 1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database latency"
          description: "P95 query latency: {{ $value }}s (target: <500ms)"

      # Disk space running low
      - alert: DiskSpaceRunningLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Disk space running low"
          description: "Only {{ $value | humanizePercentage }} remaining"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "{{ $value | humanizePercentage }} of memory in use"

      # Service down
      - alert: JuryServiceDown
        expr: up{job="jury-service"} == 0
        for: 2m
        labels:
          severity: critical
          component: jury-service
        annotations:
          summary: "Jury service is down"
          description: "Jury service has been unreachable for 2+ minutes"

      # Anchorer service down
      - alert: AnchorcherServiceDown
        expr: up{job="jury-anchorer"} == 0
        for: 2m
        labels:
          severity: critical
          component: jury-anchorer
        annotations:
          summary: "Jury anchorer service is down"
          description: "Anchorer has been unreachable for 2+ minutes"

  - name: blockchain_health
    interval: 30s
    rules:
      # Block production stopped
      - alert: BlockProductionStopped
        expr: |
          increase(substrate_blocks_finalized[5m]) == 0
        for: 10m
        labels:
          severity: critical
          component: blockchain
        annotations:
          summary: "Block production stopped"
          description: "No blocks finalized in 5+ minutes"

      # Large block time
      - alert: LargeBlockTime
        expr: substrate_block_time_seconds > 30
        for: 5m
        labels:
          severity: warning
          component: blockchain
        annotations:
          summary: "Large block time detected"
          description: "Block production time: {{ $value }}s (target: <6s)"

  - name: infrastructure
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCpuUsage
        expr: |
          (1 - avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage: {{ $value | humanizePercentage }}"

      # Network errors
      - alert: HighNetworkErrors
        expr: rate(node_network_receive_errs_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "Network errors detected"
          description: "Error rate: {{ $value | humanize }}/sec"

      # Service restart loop
      - alert: ServiceRestartLoop
        expr: increase(container_restart_count[15m]) > 3
        for: 5m
        labels:
          severity: critical
          component: services
        annotations:
          summary: "Service restart loop detected"
          description: "{{ $labels.container }} has restarted {{ $value }} times in 15 min"
