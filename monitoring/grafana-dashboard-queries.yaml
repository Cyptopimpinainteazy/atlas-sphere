"""
monitoring_queries.yaml - Prometheus monitoring configuration

Enhanced SLO tracking, custom metrics, and observability queries.
Enables proactive alerting and performance trending.
"""

# Global settings
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    service: 'jury-anchoring'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

# Rule files - Load alert rules
rule_files:
  - '/monitoring/alerts.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  # Jury Service metrics
  - job_name: 'jury-service'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Jury Anchorer metrics
  - job_name: 'jury-anchorer'
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: '/metrics'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']

  # Blockchain Node RPC metrics
  - job_name: 'blockchain-node'
    static_configs:
      - targets: ['localhost:9944']
    metrics_path: '/metrics'

# SLO Tracking Queries
slo_queries:
  # Service Level Objectives
  uptime_slo:
    name: "Jury Service Uptime SLO 99.9%"
    query: |
      (
        count(up{job="jury-service"} == 1)
        /
        count(up{job="jury-service"})
      ) * 100
    threshold: 99.9
    window: "7d"
    severity: "critical"

  latency_p99_slo:
    name: "Anchor Latency P99 < 5s SLO"
    query: |
      histogram_quantile(0.99, 
        rate(anchor_decision_latency_bucket[5m])
      )
    threshold: 5000  # milliseconds
    window: "1h"
    severity: "warning"

  success_rate_slo:
    name: "Anchor Success Rate > 99% SLO"
    query: |
      (
        increase(anchor_success_total[5m])
        /
        increase(anchor_total[5m])
      ) * 100
    threshold: 99
    window: "1h"
    severity: "critical"

  # Burn Rate Tracking (shows how fast we're using up error budget)
  availability_burn_rate:
    name: "Service Availability Burn Rate (7d)"
    query: |
      (
        1 - (
          sum(rate(requests_total{status=~"2.."}[7d]))
          /
          sum(rate(requests_total[7d]))
        )
      ) * 100
    description: "% of error budget consumed in past 7 days"

# Custom Metrics for Jury System
custom_metrics:
  decision_creation_latency:
    type: "histogram"
    help: "Time to create new jury decision session"
    buckets: [1, 5, 10, 50, 100, 500, 1000, 5000]

  decision_finalization_latency:
    type: "histogram"
    help: "Time to finalize jury decision"
    buckets: [10, 50, 100, 500, 1000, 5000, 10000]

  anchoring_latency:
    type: "histogram"
    help: "Time from decision to blockchain anchor"
    buckets: [100, 500, 1000, 2000, 5000, 10000]

  verification_success_rate:
    type: "counter"
    help: "Number of successful on-chain verifications"

  juror_participation_rate:
    type: "gauge"
    help: "% of active jurors participating in decisions"

  decision_confidence_score:
    type: "gauge"
    range: [0, 100]
    help: "Average confidence of jury decisions (higher = more certain)"

  cache_hit_rate:
    type: "gauge"
    help: "Redis cache hit rate percentage"

  db_connection_pool_usage:
    type: "gauge"
    help: "% of database connection pool in use"

  blockchain_sync_lag:
    type: "gauge"
    help: "Blocks behind the head of the chain"

# Grafana Dashboard Queries
grafana_queries:
  latency_percentiles: |
    {
      "p50": "histogram_quantile(0.50, rate(anchor_latency_bucket[5m]))",
      "p95": "histogram_quantile(0.95, rate(anchor_latency_bucket[5m]))",
      "p99": "histogram_quantile(0.99, rate(anchor_latency_bucket[5m]))",
      "max": "max(anchor_latency_bucket)",
    }

  throughput: |
    rate(anchor_total[5m])  # Decisions per second

  success_breakdown: |
    {
      "successful": "rate(anchor_success_total[5m])",
      "failed": "rate(anchor_failure_total[5m])",
      "pending": "count(current_pending_anchors)",
    }

  system_health: |
    {
      "postgres_connections": "pg_stat_activity_count",
      "redis_memory_used": "redis_memory_used_bytes",
      "disk_free": "node_filesystem_avail_bytes{fstype='ext4'}",
      "cpu_usage": "rate(process_cpu_seconds_total[5m])",
    }

  blockchain_metrics: |
    {
      "block_time": "increase(blockchain_block_number[1m])",
      "transaction_pool": "blockchain_tx_pool_size",
      "consensus_rounds": "rate(blockchain_consensus_round[5m])",
    }

  decision_funnel: |
    {
      "sessions_created": "rate(session_created_total[5m])",
      "votes_submitted": "rate(vote_submitted_total[5m])",
      "decisions_finalized": "rate(decision_finalized_total[5m])",
      "decisions_anchored": "rate(decision_anchored_total[5m])",
    }

# Alerting Rules Reference
alert_examples:
  - name: "HighAnchorLatency"
    condition: "histogram_quantile(0.95, rate(anchor_latency_bucket[5m])) > 10000"
    for: "5m"
    severity: "warning"

  - name: "LowSuccessRate"
    condition: "(rate(anchor_success_total[5m]) / rate(anchor_total[5m])) < 0.99"
    for: "5m"
    severity: "warning"

  - name: "ServiceDown"
    condition: "up{job='jury-service'} == 0"
    for: "2m"
    severity: "critical"

  - name: "DbConnectionPoolExhausted"
    condition: "pg_stat_activity_count > 45"
    for: "2m"
    severity: "critical"

  - name: "HighMemoryUsage"
    condition: "process_resident_memory_bytes > 2147483648"  # 2GB
    for: "5m"
    severity: "warning"

# Retention Policies
retention:
  metrics: "30d"          # Keep metrics for 30 days
  audit_logs: "90d"       # Keep audit logs for 90 days
  alerts_resolved: "7d"   # Keep resolved alerts for 7d (for analysis)
