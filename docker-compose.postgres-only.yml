version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_password
      POSTGRES_DB: x3_indexer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crates/x3-gateway/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
