# Solana BPF/SVM dependencies for real SVM execution
solana_rbpf = { version = "0.8", default-features = false }

# Align proc-macro2 across workspace to avoid cargo feature-resolution mismatches
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }

# Force versions that use getrandom 0.2 (wasm32-compatible)
# Note: getrandom 0.2 doesn't exist in dependencies, but constraining these
# prevents newer versions from being pulled in
ahash = { version = "0.8.11" }
tempfile = { version = "3.8.1" }
# Pin base64ct to avoid edition2024 requirement in newer versions
base64ct = { version = "=1.6.0" }

# CLI & RPC ecosystem
clap = { version = "4.4.18", features = ["derive"] }
jsonrpsee = { version = "0.22.5", default-features = false, features = ["macros", "client", "server"] }

# Build profiles - reduce codegen-units to avoid LLVM SIGSEGV crashes in 1.85
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.release.build-override]
opt-level = 3
codegen-units = 1

