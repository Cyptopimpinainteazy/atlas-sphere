[workspace]
members = [
    "pallets/atlas-kernel",
    "crates/evm-integration",
    "crates/svm-integration",
    "crates/cross-vm-bridge",
    "runtime",
    "node",
]
default-members = ["node"]
resolver = "2"

# Patch multiple crates to use wasm32-compatible versions:
# - ahash 0.8.11: uses getrandom 0.2 (instead of 0.3)
# - rustix 0.38.21: patched to use errno 0.2 (instead of 0.3)
# - tempfile 3.8.1: uses compatible rustix
# - errno 0.3.14: patched to provide stub implementation for wasm32
[patch.crates-io]
ahash = { path = "patches/ahash-local" }
rustix = { path = "patches/rustix-local" }
tempfile = { path = "patches/tempfile-local" }
errno = { path = "patches/errno-local" }

# Patch Substrate to fix sp-wasm-interface wasmtime dependency and other wasm32 compilation bugs
[patch."https://github.com/paritytech/substrate"]
sc-client-api = { path = "patches/substrate-local/client/api" }
sc-basic-authorship = { path = "patches/substrate-local/client/basic-authorship" }
sc-chain-spec = { path = "patches/substrate-local/client/chain-spec" }
sc-client-db = { path = "patches/substrate-local/client/db" }
sc-consensus = { path = "patches/substrate-local/client/consensus/common" }
sc-consensus-aura = { path = "patches/substrate-local/client/consensus/aura" }
sc-consensus-grandpa = { path = "patches/substrate-local/client/consensus/grandpa" }
sc-block-builder = { path = "patches/substrate-local/client/block-builder" }
sc-cli = { path = "patches/substrate-local/client/cli" }
sc-network = { path = "patches/substrate-local/client/network" }
sc-network-common = { path = "patches/substrate-local/client/network/common" }
sc-network-light = { path = "patches/substrate-local/client/network/light" }
sc-network-sync = { path = "patches/substrate-local/client/network/sync" }
sc-network-transactions = { path = "patches/substrate-local/client/network/transactions" }
