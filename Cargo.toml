[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Atlas Sphere Core Team <core@atlas-sphere.io>"]
homepage = "https://atlas-sphere.io"
repository = "https://github.com/atlas-sphere/atlas-sphere"
description = "Atlas Sphere Layer 1 blockchain workspace powering a dual-VM execution environment with native cross-chain operations."
license = "Apache-2.0"
readme = "README.md"
keywords = ["atlas-sphere", "substrate", "blockchain", "dual-vm", "web3"]
categories = ["cryptography::cryptocurrencies"]

[workspace.metadata]
project = "Atlas Sphere"
tagline = "Dual-VM Layer 1 with native cross-chain coherence"
maintainers = ["Atlas Sphere Core Team"]
documentation = "https://docs.atlas-sphere.io"

[workspace.dependencies]
# Core Substrate primitives (using polkadot-v1.0.0 stable branch for compatibility)
sp-api = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0", default-features = false }
sp-block-builder = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0", default-features = false }
