sc-transaction-pool = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0" }

# Runtime build tooling
substrate-build-script-utils = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0" }
substrate-wasm-builder = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0" }

# SCALE codec & metadata
parity-scale-codec = { version = "3.6.5", default-features = false, features = ["derive"] }
codec = { package = "parity-scale-codec", version = "3.6.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }

# Utilities
futures = "0.3.30"
hex-literal = "0.4.1"
log = "0.4.20"
once_cell = "1.19.0"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
thiserror = "1.0.51"

# Force versions that use getrandom 0.2 (wasm32-compatible)
# Note: getrandom 0.2 doesn't exist in dependencies, but constraining these
# prevents newer versions from being pulled in
ahash = { version = "0.8.11" }
tempfile = { version = "3.8.1" }

# CLI & RPC ecosystem
clap = { version = "4.4.18", features = ["derive"] }
jsonrpsee = { version = "0.22.5", default-features = false, features = ["macros", "client", "server"] }

