name: Playwright E2E (single worker)

on:
  pull_request:
    paths:
      - 'swarm-dashboard/**'
      - '.github/workflows/playwright-single-worker.yml'
  workflow_dispatch: {}

jobs:
  playwright-e2e-single:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ./swarm-dashboard

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./swarm-dashboard

      - name: Run Playwright tests (single worker)
        run: npx playwright test --config=e2e/playwright.config.ts -j 1 --reporter=list
        working-directory: ./swarm-dashboard

